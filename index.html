<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        .leaflet-popup-content {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .leaflet-popup-content table {
            table-layout: fixed;
            width: 100%;
        }
        .leaflet-popup-content a {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-all;
        }
        </style>
        <style>
        #category-filter {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font-family: Arial, sans-serif;
            font-size: 14px;
            min-width: 200px;
        }
        #category-filter h4 {
            margin: 0 0 8px 0;
            font-size: 15px;
        }
        #category-filter hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 10px 0;
        }
        #category-filter label {
            display: flex;
            align-items: center;
            margin: 4px 0;
            cursor: pointer;
        }
        #category-filter input {
            margin-right: 8px;
        }
        .cat-swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
            <div id="category-filter">
                <h4>Projektart</h4>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Water & Env." checked>
                    <span class="cat-swatch" style="background:rgba(72,123,182,1.0)"></span> Water &amp; Environment
                </label>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Education" checked>
                    <span class="cat-swatch" style="background:rgba(219,30,42,1.0)"></span> Education
                </label>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Emergency Programs" checked>
                    <span class="cat-swatch" style="background:rgba(255,254,97,1.0)"></span> Emergency Programs
                </label>
                <hr>
                <h4>Status</h4>
                <label>
                    <input type="checkbox" class="status-toggle" value="Overview (Q1_25-Q1_26)" checked>
                    Overview
                </label>
                <label>
                    <input type="checkbox" class="status-toggle" value="Recently (Q2_26)" checked>
                    Recently
                </label>
                <label>
                    <input type="checkbox" class="status-toggle" value="Planning (Q3)" checked>
                    Planning
                </label>
            </div>
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="layers/TPM_Monitoring_List_Aktuell_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[12.530401690313958,41.70576264187567],[17.132961780925715,48.61560834354486]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_ESRISatellite_0');
        map.getPane('pane_ESRISatellite_0').style.zIndex = 400;
        var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRISatellite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_ESRISatellite_0;
        map.addLayer(layer_ESRISatellite_0);
        map.createPane('pane_ESRIReferenceOverlay_1');
        map.getPane('pane_ESRIReferenceOverlay_1').style.zIndex = 401;
        var layer_ESRIReferenceOverlay_1 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Reference_Overlay/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRIReferenceOverlay_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_ESRIReferenceOverlay_1;
        map.addLayer(layer_ESRIReferenceOverlay_1);
        function pop_TPM_Monitoring_List_Aktuell_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>Project-ID</strong><br />' + (feature.properties['Project-ID'] !== null ? autolinker.link(String(feature.properties['Project-ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Project-ID: OFFICE_E_NAME</strong><br />' + (feature.properties['Project-ID: OFFICE_E_NAME'] !== null ? autolinker.link(String(feature.properties['Project-ID: OFFICE_E_NAME']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Project-ID: BMZ</strong><br />' + (feature.properties['Project-ID: BMZ'] !== null ? autolinker.link(String(feature.properties['Project-ID: BMZ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Link Project Page</strong><br />' + (feature.properties['Link Project Page'] !== null ? autolinker.link(String(feature.properties['Link Project Page']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_TPM_Monitoring_List_Aktuell_2_0(feature) {
            switch(String(feature.properties['Project-ID: UNIT_E_NAME'])) {
                case 'Education':
                    return {
                pane: 'pane_TPM_Monitoring_List_Aktuell_2',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(128,17,25,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(219,30,42,1.0)',
                interactive: true,
            }
                    break;
                case 'Emergency Programs':
                    return {
                pane: 'pane_TPM_Monitoring_List_Aktuell_2',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(61,128,53,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,254,97,1.0)',
                interactive: true,
            }
                    break;
                case 'Water & Env.':
                    return {
                pane: 'pane_TPM_Monitoring_List_Aktuell_2',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(50,87,128,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(72,123,182,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_TPM_Monitoring_List_Aktuell_2',
                radius: 5.2,
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(114,225,106,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_TPM_Monitoring_List_Aktuell_2');
        map.getPane('pane_TPM_Monitoring_List_Aktuell_2').style.zIndex = 402;
        map.getPane('pane_TPM_Monitoring_List_Aktuell_2').style['mix-blend-mode'] = 'normal';
        var layer_TPM_Monitoring_List_Aktuell_2 = new L.geoJson(json_TPM_Monitoring_List_Aktuell_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_TPM_Monitoring_List_Aktuell_2',
            layerName: 'layer_TPM_Monitoring_List_Aktuell_2',
            pane: 'pane_TPM_Monitoring_List_Aktuell_2',
            onEachFeature: pop_TPM_Monitoring_List_Aktuell_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_TPM_Monitoring_List_Aktuell_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_TPM_Monitoring_List_Aktuell_2);
        map.addLayer(layer_TPM_Monitoring_List_Aktuell_2);
        setBounds();
        var i = 0;
        layer_TPM_Monitoring_List_Aktuell_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Project-ID'] !== null?String('<div style="color: #ffffff; font-size: 10pt; font-weight: bold; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Project-ID']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_TPM_Monitoring_List_Aktuell_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_TPM_Monitoring_List_Aktuell_2]);
        map.on("zoomend", function(){
            resetLabels([layer_TPM_Monitoring_List_Aktuell_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_TPM_Monitoring_List_Aktuell_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_TPM_Monitoring_List_Aktuell_2]);
        });

        // ==== Filter: Projektart + Status (Recently / Overview / Planning) ====
        function applyFilters() {
            var activeCats = Array.from(document.querySelectorAll('.cat-toggle:checked')).map(function(cb) {
                return cb.value;
            });
            var activeStatus = Array.from(document.querySelectorAll('.status-toggle:checked')).map(function(cb) {
                return cb.value;
            });
            layer_TPM_Monitoring_List_Aktuell_2.eachLayer(function(layer) {
                var cat = layer.feature.properties['Project-ID: UNIT_E_NAME'];
                var status = layer.feature.properties['Recently/Overview'];
                var visible = activeCats.indexOf(cat) !== -1 && activeStatus.indexOf(status) !== -1;

                // Marker selbst ein-/ausblenden (SVG-Pfad)
                if (layer._path) {
                    layer._path.style.display = visible ? '' : 'none';
                }
                // Zugehöriges permanentes Label ein-/ausblenden
                var tooltip = layer.getTooltip ? layer.getTooltip() : null;
                if (tooltip && tooltip._container) {
                    tooltip._container.style.display = visible ? '' : 'none';
                }
            });
        }
        document.querySelectorAll('.cat-toggle, .status-toggle').forEach(function(checkbox) {
            checkbox.addEventListener('change', applyFilters);
        });

        // ==== Zoom/Extent-Fix für iFrame-Einbettung ====
        var initialBounds_TPM_Monitoring_List_Aktuell_2 = [[12.530401690313958,41.70576264187567],[17.132961780925715,48.61560834354486]];

        function fitInitialBounds() {
            map.invalidateSize();
            map.fitBounds(initialBounds_TPM_Monitoring_List_Aktuell_2);
        }

        window.addEventListener('load', function() {
            setTimeout(fitInitialBounds, 200);
        });

        if (typeof ResizeObserver !== 'undefined') {
            var mapResizeObserver = new ResizeObserver(function() {
                fitInitialBounds();
            });
            mapResizeObserver.observe(document.getElementById('map'));
        }
        </script>        
    </body>
</html>
