<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>

        <style>
        #category-filter {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font-family: Arial, sans-serif;
            font-size: 14px;
            min-width: 190px;
        }
        #category-filter h4 {
            margin: 0 0 8px 0;
            font-size: 15px;
        }
        #category-filter label {
            display: flex;
            align-items: center;
            margin: 4px 0;
            cursor: pointer;
        }
        #category-filter input {
            margin-right: 8px;
        }
        .cat-swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
            <div id="category-filter">
                <h4>Projektart</h4>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Water & Env." checked>
                    <span class="cat-swatch" style="background:rgba(72,123,182,1.0)"></span> Water &amp; Environment
                </label>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Education" checked>
                    <span class="cat-swatch" style="background:rgba(219,30,42,1.0)"></span> Education
                </label>
                <label>
                    <input type="checkbox" class="cat-toggle" value="Emergency Programs" checked>
                    <span class="cat-swatch" style="background:rgba(255,254,97,1.0)"></span> Emergency Programs
                </label>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/NEWTPMMonitoringList_2.js"></script>
        <script src="styles/NEWTPMMonitoringList_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
        document.querySelectorAll('.cat-toggle').forEach(function(checkbox) {
            checkbox.addEventListener('change', function() {
                window.activeCategories_NEWTPMMonitoringList_2 = Array.from(
                    document.querySelectorAll('.cat-toggle:checked')
                ).map(function(cb) { return cb.value; });

                if (typeof lyr_NEWTPMMonitoringList_2 !== 'undefined') {
                    lyr_NEWTPMMonitoringList_2.changed();
                }
            });
        });
        </script>
    </body>
</html>
